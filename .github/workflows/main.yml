name: CI / Lint / Test and Deploy

on:
  push:
    branches: [Course 8]
  pull_request:
    branches: [Course 8]

jobs:
  test:
    name: Run tests with PostgreSQL and linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries=5

    steps:
      - name: Checkout code 📜
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies  & Linting
        run: |
          python -m pip install --upgrade pip wheel setuptools black flake8 isort safety pip-tools mypy pytest pytest-django pytest-cov codecov coveralls django-stubs psycopg2-binary redis celery[redis]
          pip install -r requirements.txt

          # Linting & Formatting Checks 
          black --check .
          flake8 .
          isort --check-only .
          mypy .

          # Run tests with coverage 
          python manage.py test courses.tests --verbosity=2 --failfast --nomigrations

  build-docker:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker-compose build

  deploy:
    name: Deploy to Server
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            git pull origin main

            docker-compose pull && docker-compose up -d --build

            
