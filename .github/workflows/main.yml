name: CI / Lint / Test

on:
  push:
    branches: [ Homework-35.2 ]
  pull_request:
    branches: [ Homework-35.2 ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout repository 📜
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Python 3.13.14
      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'

      # Шаг 3: Устанавливаем зависимости (включая линтер)
      - name: Install Dependencies 📦
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt flake8

      # Шаг 4: Проверка стиля кода (Linting)
      - name: Linting with Flake8 ✨
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=119 --statistics

      # Шаг 5: Запуск тестов Django
      - name: Run Django Tests 🧪
        run: |
          python manage.py test --settings=config.settings.test --verbosity=2 --failfast
