name: CI / Lint / Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout repository 📜
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Python 3.11
      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '4.2.17'

      # Шаг 3: Устанавливаем зависимости (включая линтер)
      - name: Install Dependencies 📦
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt flake8

      # Шаг 4: Проверка стиля кода (Linting)
      - name: Linting with Flake8 ✨
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # Шаг 5: Запуск тестов Django
      - name: Run Django Tests 🧪
        run: |
          python manage.py test --settings=config.settings.test --verbosity=2 --failfast
