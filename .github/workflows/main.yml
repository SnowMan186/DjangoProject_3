name: CI / Lint / Test and Deploy

on:
  push:
    branches: [ Homework-35.2 ]
  pull_request:
    branches: [ Homework-35.2 ]

jobs:
  # --- ЭТАП 1: ТЕСТЫ (с использованием реальной БД PostgreSQL) ---
  test:
    name: Run tests with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code 📜
        uses: actions/checkout@v4

      - name: Set up Python 3.12 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies 📦
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Wait for PostgreSQL to start ⏱️
        run: |
          echo "Waiting for Postgres..."
          until pg_isready -h localhost -p 5432 -U test_user; do
            sleep 1
          done
          echo "Postgres is ready!"

      - name: Run Migrations and Tests 🧪
        env:
          DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python manage.py migrate
          python manage.py test --settings=config.settings.test --verbosity=2

  # --- ЭТАП 2: ДЕПЛОЙ (выполняется только если тесты успешны) ---
  deploy:
    name: Deploy to Server 🚀
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 📜
        uses: actions/checkout@v4

      - name: Deploy over SSH 🔑
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            
            cd ${{ secrets.DEPLOY_DIR }}
                       
            git pull origin main
        
            source venv/bin/activate
            python manage.py migrate --settings=config.settings.production
           
            python manage.py collectstatic --noinput --clear
            
            sudo systemctl restart lms
            
            sudo systemctl reload nginx
