name: CI/CD Pipeline

on:
  push:
    branches: [ main ] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 📜
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies 📦
        run: |
          python -m pip install --upgrade pip wheel setuptools gunicorn flake8 # Добавил flake8 для линтинга (этап Линт)
          pip install -r requirements.txt

      - name: Linting (ФЛИНТ) ✨ 
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests 🧪 (Остановит пайплайн, если упадут)
        run: |
          python manage.py test --settings=config.settings.test --verbosity=2 --failfast

      - name: Deploy to Server 🚀 (Выполняется только если тесты прошли)
        if: success()
        uses: appleboy/ssh-action@master 
        with:
          host: ${{ secrets.SERVER_IP }} # Берем IP из секретов!
          username: deploy 
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Берем приватный ключ из секретов!
          script: |
            cd lms_project

            git pull origin main # Забираем новые изменения

            source venv/bin/activate

            pip install -r requirements.txt # Обновляем зависимости

            python manage.py migrate --settings=config.settings.production # Миграции БД

            python manage.py collectstatic --noinput --clear # Собираем статику

            sudo systemctl restart lms # Перезапускаем наше приложение (Gunicorn)
            sudo systemctl reload nginx # Перезапускаем Nginx (не обязательно, но полезно)
