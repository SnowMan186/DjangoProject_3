version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: django_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms_db
      POSTGREE_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./static:/static
      - ./media:/media
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: django_web
    restart: unless-stopped
    command: >
      bash -c "python manage.py wait_for_db --host db --port 5432 --user lms_user --pass lms_password --db lms_db &&
              python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: django_worker
    restart: unless-stopped
    command: >
      bash -c "python manage.py wait_for_db --host db --port 5432 --user lms_user --pass lms_password --db lms_db &&
              python manage.py migrate &&
              celery -A config worker -l info"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  beat:
    build: .
    container_name: django_beat
    restart: unless-stopped
    command: >
      bash -c "python manage.py wait_for_db --host db --port 5432 --user lms_user --pass lms_password --db lms_db &&
              python manage.py migrate &&
              celery -A config beat -l info"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: django_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./static:/static
    depends_on:
      - web

volumes:
  db_data: